# Builds the standalone Windows app (no Python needed by users), tests the
# install scripts and the .exe on a clean Windows machine, and publishes the
# .exe as the "speed-strength-latest" pre-release.
name: Speed & Strength — Windows build

on:
  push:
    paths:
      - "speed-strength-app/**"
      - ".github/workflows/speed-strength-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: speed-strength-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with setup.ps1 (Windows PowerShell 5.1, as users run it)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -Dev; if ($LASTEXITCODE) { exit 1 }

      - name: Test and build with build.ps1
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1; if ($LASTEXITCODE) { exit 1 }

      - name: Smoke-test the .exe with Python removed from PATH
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:SBE_MODIFIER_HOME = "$env:RUNNER_TEMP\exe-home"
          $p = Start-Process -FilePath dist\SBESpeedStrength.exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:SBE_MODIFIER_HOME\logs\app.log"
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:SBE_MODIFIER_HOME\logs\app.log" -Pattern "SMOKE TEST PASSED" -Quiet)) {
            throw "smoke test did not pass"
          }
          Get-Item dist\SBESpeedStrength.exe | Format-List Name, Length

      - name: Test uninstall.ps1
        run: |
          Copy-Item dist\SBESpeedStrength.exe $env:RUNNER_TEMP\
          powershell -NoProfile -ExecutionPolicy Bypass -File uninstall.ps1
          if (Test-Path .venv) { throw ".venv still present" }

      - uses: actions/upload-artifact@v4
        with:
          name: SBESpeedStrength-windows
          path: ${{ runner.temp }}\SBESpeedStrength.exe

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'claude/stoic-wright-k5ivg8' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete speed-strength-latest --cleanup-tag --yes 2>$null
          $notes = "Standalone Windows app built from $env:GITHUB_SHA. No Python needed: download SBESpeedStrength.exe and double-click it. " +
                   "Windows SmartScreen may warn because the file is not code-signed: choose More info -> Run anyway."
          gh release create speed-strength-latest "$env:RUNNER_TEMP\SBESpeedStrength.exe" --prerelease --target $env:GITHUB_SHA `
            --title "Steal And Break Eggs - Speed & Strength (Windows)" --notes $notes
          if ($LASTEXITCODE) { exit 1 }
